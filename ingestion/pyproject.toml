[project]
name = "fdic-pipeline"
version = "1.0.0"
description = "Extract FDIC BankFind data to S3 as gzipped NDJSON"
requires-python = ">=3.11"
dependencies = []  # standard library only; boto3 comes with the Lambda runtime

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "boto3>=1.34"]

[tool.setuptools]
packages = ["fdic_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
